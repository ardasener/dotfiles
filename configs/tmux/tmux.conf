unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g default-terminal "tmux-256color"
set -as terminal-features ",tmux-256color:RGB,screen-256color:RGB,xterm-256color:RGB,wezterm:RGB"
set -g base-index 1
if-shell 'test -x /usr/bin/zsh' 'set -g default-shell /usr/bin/zsh' 'set -g default-shell /bin/zsh'

set -g status-position top
set -g status-style bg="#1e1e2e",fg="#cdd6f4"
set -g status-left ""
set -g status-right "#{b:session_name} "
set -g status-left-length 0
set -g status-right-length 32
set -g window-status-separator ""
set -g window-status-current-style fg="#cba6f7",bold
set -g window-status-format " #W "
set -g window-status-current-format " #W "
set -g window-status-bell-style fg="#f38ba8",bold

bind-key -n C-Tab next-window
bind-key -n C-S-Tab previous-window
bind-key -n C-PageDown next-window
bind-key -n C-PageUp previous-window
bind-key -n C-1 select-window -t 1
bind-key -n C-2 select-window -t 2
bind-key -n C-3 select-window -t 3
bind-key -n C-4 select-window -t 4
bind-key -n C-5 select-window -t 5
bind-key -n C-6 select-window -t 6
bind-key -n C-7 select-window -t 7
bind-key -n C-8 select-window -t 8
bind-key -n C-9 select-window -t 9
bind-key -n C-0 select-window -t 10
bind-key -n C-Left if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys C-w h' 'select-pane -L'
bind-key -n C-Right if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys C-w l' 'select-pane -R'
bind-key -n C-Up if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys C-w k' 'select-pane -U'
bind-key -n C-Down if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys C-w j' 'select-pane -D'
bind-key -n C-q confirm-before -p "Kill this tmux session?" kill-session
bind Q confirm-before -p "Kill this tmux session?" kill-session
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind-key g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind-key t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

setw -g mode-keys vi
